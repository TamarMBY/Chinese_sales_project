<div class="category-wrapper">
  <div class="admin-top-action-bar">
    <button nz-button nzType="default" class="aristocrat-btn refresh-btn" (click)="refreshList()">
      <span nz-icon nzType="reload"></span>
      רענן רשימה
    </button>
    
    <button nz-button nzType="primary" class="aristocrat-btn" (click)="resetForm(); showAdminForm = true">
      <span nz-icon nzType="plus"></span>
      הוספת קטגוריה חדשה
    </button>
  </div>

  <div class="category-nav-bar">
    <div class="pills-container">
      <button class="pill-item" [class.active]="categoryIdForFilter === 0" (click)="getById(0)">
        הכל
      </button>

      @for(c of list$ | async; track c.id) {
        <div class="pill-group">
          <button class="pill-item" [class.active]="categoryIdForFilter === c.id" (click)="getById(c.id!)">
            {{c.name}}
          </button>
          
          <div class="mini-actions">
            <span nz-icon nzType="edit" nz-tooltip nzTooltipTitle="ערוך" 
                  (click)="openEdit(c); showAdminForm = true"></span>
            <span nz-icon nzType="delete" nz-tooltip nzTooltipTitle="מחק" 
                  (click)="delete(c.id!)" class="delete-icon"></span>
          </div>
        </div>
      }
    </div>
  </div>

  <app-gift [categoryId]="categoryIdForFilter"></app-gift>

  <nz-modal
    [(nzVisible)]="showAdminForm"
    [nzTitle]="modalTitle"
    nzOkText="אישור"
    nzCancelText="ביטול"
    (nzOnCancel)="showAdminForm = false; resetForm()"
    (nzOnOk)="save(); showAdminForm = false"
    nzCentered>
   
    <ng-template #modalTitle>
      <span class="modal-header-text">
        {{ isEditMode ? 'עריכת קטגוריה: ' + draftCategory.name : 'יצירת קטגוריה חדשה' }}
      </span>
    </ng-template>

    <ng-container *nzModalContent>
      <div class="friendly-form">
        <div class="form-group">
          <label>שם הקטגוריה *</label>
          <input nz-input [(ngModel)]="draftCategory.name" placeholder="לדוגמה: כלי בית..." />
        </div>
        <div class="form-group">
          <label>תיאור</label>
          <textarea nz-input [(ngModel)]="draftCategory.description" rows="3" placeholder="הוסף תיאור קצר לקטגוריה..."></textarea>
        </div>
      </div>
    </ng-container>
  </nz-modal>
</div>
