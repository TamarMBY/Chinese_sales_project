<div class="container" dir="rtl">
  
  <div *ngIf="errorMessage" style="margin-bottom: 20px;">
    <nz-alert nzType="error" [nzMessage]="errorMessage" nzShowIcon nzCloseable (nzOnClose)="errorMessage = null"></nz-alert>
  </div>

  <div class="admin-actions-top" *ngIf="authSrv.isAdmin()" style="margin-bottom: 20px;">
    <button nz-button nzType="primary" class="gold-btn" (click)="openAddModal()">
      <span nz-icon nzType="plus"></span> הוספת מתנה חדשה
    </button>
  </div>

  <div class="filter-section">
    <div nz-row [nzGutter]="16" nzAlign="bottom">
      <div nz-col [nzXs]="24" [nzSm]="6">
        <label>שם מתנה</label>
        <input nz-input [(ngModel)]="filterValues.name" type="text" placeholder="חיפוש לפי שם" />
      </div>
      <div nz-col [nzXs]="12" [nzSm]="4">
        <label>קטגוריה</label>
        <nz-input-number [(ngModel)]="filterValues.categoryId" [nzMin]="0" style="width: 100%"></nz-input-number>
      </div>
      <div nz-col [nzXs]="12" [nzSm]="5">
        <label>ID תורם</label>
        <input nz-input [(ngModel)]="filterValues.donorId" type="text" placeholder="חיפוש לפי תורם" />
      </div>
      <div nz-col [nzXs]="24" [nzSm]="9" class="filter-actions">
        <button nz-button nzType="primary" class="gold-btn" (click)="filter()">
          סנן
        </button>
        <button nz-button nzType="default" (click)="refreshList()">נקה</button>
      </div>
    </div>
  </div>

  <nz-divider></nz-divider>

  <div nz-row [nzGutter]="[20, 20]">
    @for (g of (list$ | async); track g.id) {
    <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" [nzLg]="6">
      <nz-card [nzCover]="coverTemplate" class="gift-card" [nzActions]="[actionEdit, actionDelete, actionLottery]">
        <div class="card-body">
          <h3 class="gift-title">{{ g.name }}</h3>
          <div class="donor-info">
             <span class="donor-name">{{ g.donor?.name || 'תורם אנונימי' }}</span>
          </div>
          <button nz-button nzType="primary" class="gold-btn buy-btn" (click)="getById(g.id!)">הוספה לסל</button>
          
          <div *ngIf="g.isDrawn" class="winner-label">
            <span nz-icon nzType="check-circle"></span> זוכה: {{ g.winner?.fullName }}
          </div>
        </div>
      </nz-card>

      <ng-template #coverTemplate>
        <div class="card-image-wrapper">
          <img [src]="g.imageUrl || 'assets/default-gift.jpg'" />
        </div>
      </ng-template>

      <ng-template #actionEdit>
        <span nz-icon nzType="edit" (click)="openEdit(g)" nz-tooltip nzTooltipTitle="ערוך"></span>
      </ng-template>
      <ng-template #actionDelete>
        <span nz-icon nzType="delete" (click)="delete(g.id!)" nz-tooltip nzTooltipTitle="מחק"></span>
      </ng-template>
      <ng-template #actionLottery>
        <span nz-icon nzType="thunderbolt" *ngIf="!g.isDrawn" (click)="lottery(g.id!)" nz-tooltip nzTooltipTitle="בצע הגרלה"></span>
      </ng-template>
    </div>
    }
  </div>

  <nz-modal
    [(nzVisible)]="isModalVisible"
    [nzTitle]="isEditMode ? 'עריכת מתנה' : 'הוספת מתנה חדשה'"
    (nzOnCancel)="handleCancel()"
    (nzOnOk)="save()"
    [nzOkText]="isEditMode ? 'עדכן' : 'שמור'"
    nzCancelText="ביטול"
    [nzWidth]="600"
  >
    <ng-container *nzModalContent>
      <form #giftForm="ngForm" nz-form nzLayout="vertical">
        <div nz-row [nzGutter]="16">
          <div nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label nzRequired>שם המתנה</nz-form-label>
              <nz-form-control nzErrorTip="שדה חובה">
                <input nz-input name="name" [(ngModel)]="draftGift.name" required />
              </nz-form-control>
            </nz-form-item>
          </div>

          <div nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label nzRequired>מזהה תורם</nz-form-label>
              <nz-form-control nzErrorTip="שדה חובה">
                <input nz-input name="donorId" [(ngModel)]="draftGift.donorId" required />
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>

        <nz-form-item>
          <nz-form-label>תיאור המתנה</nz-form-label>
          <nz-form-control>
            <textarea nz-input name="description" [(ngModel)]="draftGift.description" rows="3"></textarea>
          </nz-form-control>
        </nz-form-item>

        <div nz-row [nzGutter]="16">
          <div nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label>קטגוריה</nz-form-label>
              <nz-input-number name="categoryId" [(ngModel)]="draftGift.categoryId" style="width: 100%"></nz-input-number>
            </nz-form-item>
          </div>
          <div nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label nzRequired>מחיר כרטיס</nz-form-label>
              <nz-input-number name="price" [(ngModel)]="draftGift.price" [nzMin]="1" style="width: 100%"></nz-input-number>
            </nz-form-item>
          </div>
        </div>

        <nz-form-item>
          <nz-form-label>כתובת תמונה (URL)</nz-form-label>
          <input nz-input name="imageUrl" [(ngModel)]="draftGift.imageUrl" />
        </nz-form-item>
      </form>
    </ng-container>
